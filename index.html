<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#06060b" />
<meta name="description" content="Liquid Beats — a premium liquid glass music player." />
<title>Liquid Beats — Premium Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ AMBIENT BACKGROUND ============ -->
  <div class="bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="blob blob-4"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <!-- ============ APP ============ -->
  <div class="app">

    <!-- Top bar -->
    <header class="topbar glass-soft">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h10"/>
        </svg>
      </button>

      <div class="brand">
        <span class="brand-dot"></span>
        <span>Liquid Beats</span>
      </div>

      <button class="icon-btn" id="listBtn" aria-label="Open playlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 6h11M4 12h11M4 18h7"/><circle cx="18" cy="16" r="2.5"/><path d="M20.5 16V7l-3 1"/>
        </svg>
      </button>
    </header>

    <!-- Stage -->
    <div class="stage">

      <!-- ======= PLAYER ======= -->
      <main class="player glass">

        <!-- Artwork -->
        <section class="art-wrap">
          <div class="art-halo" aria-hidden="true"></div>
          <div class="art-frame" id="artFrame">
            <div class="art-liquid" aria-hidden="true"></div>
            <div class="art-shine" aria-hidden="true"></div>
            <div class="art-noise" aria-hidden="true"></div>
            <div class="art-badge" id="artBadge">
              <span></span><span></span><span></span>
            </div>
          </div>
        </section>

        <!-- Visualizer -->
        <div class="viz" id="viz" aria-hidden="true"></div>

        <!-- Meta -->
        <section class="meta">
          <h1 class="title" id="title">—</h1>
          <p class="artist" id="artist">—</p>
        </section>

        <!-- Progress -->
        <section class="progress-block">
          <div class="bar" id="bar" role="slider" aria-label="Seek" tabindex="0"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="bar-track"></div>
            <div class="bar-fill" id="barFill"><i class="bar-knob"></i></div>
          </div>
          <div class="times">
            <span id="cur">0:00</span>
            <span id="dur">0:00</span>
          </div>
        </section>

        <!-- Controls -->
        <section class="controls">
          <button class="ctrl" id="shuffleBtn" aria-label="Shuffle" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/>
            </svg>
          </button>

          <button class="ctrl" id="prevBtn" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 5a1 1 0 0 1 2 0v14a1 1 0 0 1-2 0V5Zm12.6.3a1 1 0 0 1 .4.8v11.8a1 1 0 0 1-1.5.86l-9.2-5.9a1 1 0 0 1 0-1.72l9.2-5.9a1 1 0 0 1 1.1.06Z"/>
            </svg>
          </button>

          <button class="play-btn" id="playBtn" aria-label="Play">
            <span class="play-ring" aria-hidden="true"></span>
            <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7.5 4.6a1 1 0 0 1 1.5-.87l10.2 6.53a1 1 0 0 1 0 1.7L9 18.5a1 1 0 0 1-1.5-.86V4.6Z"/>
            </svg>
            <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6.5" y="4.5" width="4" height="15" rx="1.4"/>
              <rect x="13.5" y="4.5" width="4" height="15" rx="1.4"/>
            </svg>
          </button>

          <button class="ctrl" id="nextBtn" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 5a1 1 0 0 0-2 0v14a1 1 0 0 0 2 0V5ZM5.4 5.3a1 1 0 0 0-.4.8v11.8a1 1 0 0 0 1.5.86l9.2-5.9a1 1 0 0 0 0-1.72l-9.2-5.9a1 1 0 0 0-1.1.06Z"/>
            </svg>
          </button>

          <button class="ctrl" id="repeatBtn" aria-label="Repeat" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
              <path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>
            </svg>
            <span class="rep-one" aria-hidden="true">1</span>
          </button>
        </section>

        <!-- Volume -->
        <section class="volume">
          <button class="icon-btn sm" id="volBtn" aria-label="Mute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/>
              <path class="vol-wave" d="M15.5 8.5a5 5 0 0 1 0 7"/>
              <path class="vol-wave" d="M18.5 5.8a9 9 0 0 1 0 12.4"/>
              <path class="vol-x" d="M16 9.5l5 5M21 9.5l-5 5"/>
            </svg>
          </button>
          <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume" />
          <span class="vol-val" id="volVal">80</span>
        </section>
      </main>

      <!-- ======= PLAYLIST SHEET ======= -->
      <aside class="sheet glass" id="sheet" aria-label="Playlist">
        <div class="sheet-handle" id="sheetHandle" aria-hidden="true"></div>

        <div class="sheet-head">
          <div>
            <h2>Up Next</h2>
            <p id="sheetSub">0 tracks</p>
          </div>
          <button class="icon-btn sm" id="closeSheet" aria-label="Close playlist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>

        <ul class="playlist" id="playlist"></ul>
      </aside>

    </div>

    <footer class="foot">
      <span>Made with</span>
      <span class="heart">♥</span>
      <span>Liquid Glass</span>
    </footer>
  </div>

  <!-- Backdrop for mobile sheet -->
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <audio id="audio" preload="metadata"></audio>
  <script src="script.js"></script>
</body>
</html>
